services:
  couchdb:
    image: couchdb:3.3.2
    container_name: humanitysync_couchdb
    environment:
      - COUCHDB_USER=${COUCHDB_USER:-admin}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:-adminpassword}
    volumes:
      - couchdb_data:/opt/couchdb/data
      - ./couchdb/local.ini:/opt/couchdb/etc/local.d/local.ini
    ports:
      - "${COUCHDB_PORT:-5984}:5984"
    networks:
      - humanitysync_net
    restart: unless-stopped

  gateway:
    image: node:18-alpine
    container_name: humanitysync_gateway
    working_dir: /app
    volumes:
      - ./gateway:/app
    command: sh -c "npm install && npm run dev"
    environment:
      - COUCHDB_URL=http://${COUCHDB_USER:-admin}:${COUCHDB_PASSWORD:-adminpassword}@couchdb:5984
      - JWT_SECRET=${JWT_SECRET:-supersecretjwttokenkey12345}
      - PORT=${GATEWAY_PORT:-3000}
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    depends_on:
      - couchdb
    networks:
      - humanitysync_net
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: humanitysync_nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist/spa:/usr/share/nginx/html:ro
    depends_on:
      - gateway
    networks:
      - humanitysync_net
    restart: unless-stopped


networks:
  humanitysync_net:
    driver: bridge

volumes:
  couchdb_data:
    driver: local
