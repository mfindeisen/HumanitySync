services:
  couchdb:
    image: couchdb:3.3.2
    container_name: humanitysync_couchdb
    environment:
      - COUCHDB_USER=${COUCHDB_USER:-admin}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:-adminpassword}
    volumes:
      - couchdb_prod_data:/opt/couchdb/data
      - ./couchdb/local.ini:/opt/couchdb/etc/local.d/local.ini
    restart: unless-stopped
    networks:
      - humanitysync_prod_net

  gateway:
    image: node:20-alpine
    container_name: humanitysync_gateway
    working_dir: /app
    volumes:
      - ./gateway:/app
    command: sh -c "npm install --production && node server.js"
    environment:
      - COUCHDB_URL=http://${COUCHDB_USER:-admin}:${COUCHDB_PASSWORD:-adminpassword}@couchdb:5984
      - JWT_SECRET=${JWT_SECRET:-supersecretjwttokenkey12345}
      - PORT=${GATEWAY_PORT:-3000}
    depends_on:
      - couchdb
    restart: unless-stopped
    networks:
      - humanitysync_prod_net

  nginx:
    image: nginx:stable-alpine
    container_name: humanitysync_nginx
    ports:
      - "${NGINX_PROD_PORT:-8085}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist/spa:/usr/share/nginx/html:ro
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - humanitysync_prod_net

networks:
  humanitysync_prod_net:
    driver: bridge

volumes:
  couchdb_prod_data:
    driver: local
